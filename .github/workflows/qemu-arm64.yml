name: QEMU ARM64 Emulation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-arm64-qemu:
    name: ARM64 Native Core under QEMU
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 cross-compiler and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross make qemu-user-static

      - name: Cross-compile C Native Core for ARM64
        run: |
          CC=aarch64-linux-gnu-gcc make -C core clean all
          CC=aarch64-linux-gnu-gcc make -C core bin/test_fingerprint bin/test_governor bin/test_rknn bin/test_jetson

      - name: Execute ARM64 Native Tests under QEMU
        run: |
          cd core
          qemu-aarch64-static -L /usr/aarch64-linux-gnu ./bin/test_fingerprint
          qemu-aarch64-static -L /usr/aarch64-linux-gnu ./bin/test_governor
          qemu-aarch64-static -L /usr/aarch64-linux-gnu ./bin/test_rknn
          qemu-aarch64-static -L /usr/aarch64-linux-gnu ./bin/test_jetson
          qemu-aarch64-static -L /usr/aarch64-linux-gnu ./bin/litrun-probe
